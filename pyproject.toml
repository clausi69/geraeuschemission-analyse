[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-analysis"
version = "0.1.0"
description = "Geräuschemissions-Analyse aus ARTA-Spektrum-PNGs mit Excel-Report"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10.0", "openpyxl>=3.1", "matplotlib>=3.8"]

[project.scripts]
noise-analysis = "noise_analysis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
